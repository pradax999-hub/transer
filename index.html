  <style>

    const FAQ = [

    function pointAlong(coords, ratio) {
      if (!coords || coords.length < 2) return { point: coords ? coords[0] : null, remainKm: 0, totalKm: 0 };
      const segs = []; let total = 0;
      for (let i = 1; i < coords.length; i++) { const d = kmBetween(coords[i - 1], coords[i]); segs.push(d); total += d; }
      const target = total * Math.max(0, Math.min(1, ratio));
      let acc = 0;
      for (let i = 0; i < segs.length; i++) {
        if (acc + segs[i] >= target) {
          const r = segs[i] ? (target - acc) / segs[i] : 0, a = coords[i], b = coords[i + 1];

    async function fetchRoute(from, to) {
      try {
        const r = await fetch(`${CONFIG.routeEndpoint}/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`, { signal: AbortSignal.timeout(9000) });
        if (!r.ok) throw new Error();
        const d = await r.json();
        const coords = d && d.routes && d.routes[0] && d.routes[0].geometry && d.routes[0].geometry.coordinates;
        if (!Array.isArray(coords) || coords.length < 2) throw new Error();
        return { coords: coords.map(c => [c[1], c[0]]), src: L('reálná trasa OSRM', 'real route via OSRM') };
      } catch {
        return { coords: [from, to], src: L('přímá linka – routing nedostupný', 'straight line – routing unavailable') };
      }
    }
    async function startLive(o) {
      const box = $('#live-map');
      if (!box || !o) return;
      if (live.map || live.timer) stopLive();
      if (!window.L) { setBadgeLive(L('Mapa se nenačetla', 'Map failed to load'), 'err'); clearLiveStats(L('Leaflet offline', 'Leaflet offline')); return; }
      const meet = o.ext && o.ext.fromAirport ? MEETS[o.ext.meet] : null;
      const pickup = meet ? [meet.lat, meet.lng] : geoOf(o.from);
      const target = o.ext && o.ext.mode !== 'hourly' ? geoOf(o.to) : null;
      if (!pickup) { setBadgeLive(L('Bez souřadnic', 'No coordinates'), 'off'); clearLiveStats(L('trasa není známa', 'route unknown')); return; }
      let coords = [pickup], src = L('bez trasy', 'no route');
      if (target) { const r = await fetchRoute(pickup, target); coords = r.coords; src = r.src; }
      const s = $('#live-src'); if (s) s.textContent = src;
      box.innerHTML = '';
      const map = L.map(box, { scrollWheelZoom: false, zoomControl: true });
      live.map = map; live.route = coords; live.order = o.id;
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
      L.marker(pickup, { icon: pinIcon(false) }).addTo(map).bindTooltip(L('Vyzvednutí', 'Pickup'), { direction: 'top', offset: [0, -22] });
      if (target) L.marker(target, { icon: pinIcon(true) }).addTo(map).bindTooltip(L('Cíl', 'Destination'), { direction: 'top', offset: [0, -22] });
      if (coords.length > 1) L.polyline(coords, { color: '#f5c66b', weight: 3, opacity: .85, dashArray: '6 5' }).addTo(map);
      const b = L.latLngBounds(coords);
      map.fitBounds(b, { padding: [44, 44] });
      if (target && b.getNorth() - b.getSouth() > 0.6) map.setZoom(7);
      setTimeout(() => { if (live.map) live.map.invalidateSize(); }, 120);
      await pollLive();

    async function pollLive() {
      const map = live.map, id = live.order;
      if (!map || !id) return;
      try {
        const r = await fetch(`${CONFIG.driverEndpoint}/${encodeURIComponent(id)}`, { signal: AbortSignal.timeout(6000) });
        if (r.status === 404) { setBadgeLive(L('Rezervace není v dispečinku', 'Booking not in dispatch'), 'off'); clearLiveStats(L('dispečink', 'dispatch')); return; }
        if (!r.ok) throw new Error();
        const d = await r.json();
        if (d.source) { const s = $('#live-src'); if (s) s.textContent = d.source; }
        if (!d.assigned) {
          setBadgeLive(L('Čeká na přidělení řidiče', 'Waiting for driver assignment'), 'off');
          if (live.marker) { map.removeLayer(live.marker); live.marker = null; }
          clearLiveStats();
          return;
        }
        const hasRealPos = Number.isFinite(d.lat) && Number.isFinite(d.lng);
        const along = live.route.length > 1 ? pointAlong(live.route, d.progress || 0) : null;
        const pos = hasRealPos ? [d.lat, d.lng] : along && along.point;
        if (!pos) { setBadgeLive(L('Řidič nevysílá polohu', 'Driver not broadcasting'), 'off'); clearLiveStats(); return; }
        if (!live.marker) live.marker = L.marker(pos, { icon: carIcon(), zIndexOffset: 900 }).addTo(map);
        else live.marker.setLatLng(pos);
        if (!map.getBounds().contains(pos)) map.panTo(pos, { animate: true });
        const remainKm = Number.isFinite(d.remainingKm) ? d.remainingKm : (along ? along.remainKm : 0);
        const speed = Math.max(8, Number(d.speedKmh) || 32);
        const etaSec = Number.isFinite(d.etaSec) ? d.etaSec : Math.round((remainKm / speed) * 3600);
        const doneP = (d.progress || 0) >= 1;
        setBadgeLive(doneP ? L('Řidič je na místě', 'Driver is at the spot') : `${L('Jede', 'En route')} · ${Math.round((d.progress || 0) * 100)} %`);
        const prog = $('#live-prog'); if (prog) prog.style.width = `${Math.round((d.progress || 0) * 100)}%`;
        const eta = $('#live-eta'); if (eta) eta.textContent = etaSec <= 0 ? L('teď', 'now') : `${Math.max(1, Math.round(etaSec / 60))} min`;
        const dist = $('#live-dist');
        if (dist) dist.textContent = `${remainKm.toFixed(1).replace('.', lang === 'cs' ? ',' : '.')} km`;
        const upd = $('#live-upd');
        if (upd) {
          const age = d.updatedAt ? Math.max(0, Math.round((Date.now() - new Date(d.updatedAt).getTime()) / 1000)) : null;
          upd.textContent = age === null ? '—' : age < 5 ? L('právě teď', 'just now') : L(`před ${age} s`, `${age} s ago`);
        }
      } catch {
        setBadgeLive(L('Dispečink nedostupný', 'Dispatch unreachable'), 'err');
      }
    }

    /* ---------- router ---------- */
    const stopSim = () => { if (timer) clearInterval(timer); timer = null; simId = null; stopLive(); };
    function route() {
      menu(false); stopSim();
      if (modal.open) modal.close();
      let h = location.hash.slice(1) || '/';
      if (!h.startsWith('/')) h = '/';
      const [p, qs = ''] = h.split('?');
      path = p.replace(/\/$/, '') || '/';
      const urlParams = new URLSearchParams(qs || window.location.search);
      const ref = urlParams.get('ref');
      if (ref && /^WY-[A-Z0-9]{6}$/.test(ref) && ref !== refCode && !orders.some(o => !o.cancelled)) { S.promo = ref; S.discount = .1; }

      // Обработка возврата после успешной оплаты из платёжного шлюза
      const paidOrderId = urlParams.get('orderId');
      const paymentStatus = urlParams.get('payment');
      if (paidOrderId && paymentStatus === 'success') {
        const found = orders.find(x => x.id === paidOrderId);
        if (found) {
          found.payState = 'paid';
          save();
          toast(L('Platba byla úspěšně přijata a potvrzena bankou!', 'Payment was successfully received and confirmed!'));
        }
      }
      const home = path === '/';
      document.body.classList.toggle('is-sub', !home);
      $('#stats').hidden = !home;
      const active = { '/sluzby': 'services', '/vozy': 'fleet', '/letiste': 'airport', '/firmy': 'business', '/napoveda': 'help', '/jizdy': 'trips' }[path] || '';
      $$('.nav-link').forEach(a => { const on = a.dataset.p === active; a.classList.toggle('active', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
      const R = { '/': renderHome, '/sluzby': renderServices, '/vozy': renderFleet, '/letiste': renderAirport, '/firmy': renderBusiness, '/jizdy': renderTrips, '/hodnoceni': renderReviews, '/napoveda': renderHelp, '/doporuceni': renderRef };
      if (R[path]) R[path]();
      else if (path.startsWith('/jizda/')) { try { renderOrder(decodeURIComponent(path.slice(7))); } catch { renderMissing(); } }
      else renderMissing();
      const titles = { '/': L('Taxi na letiště Praha', 'Prague airport taxi'), '/sluzby': t('nav.services'), '/vozy': t('nav.fleet'), '/letiste': t('nav.airport'), '/firmy': t('nav.business'), '/jizdy': t('nav.trips'), '/hodnoceni': L('Hodnocení', 'Reviews'), '/napoveda': t('nav.help'), '/doporuceni': L('Doporučení', 'Referrals') };
      document.title = `Wayro | ${titles[path] || L('Rezervace', 'Booking')}`;
      count(); anim(app); window.scrollTo(0, 0);
      if (navCount++ > 0 && !home) { const hh = $('h1', app); hh?.setAttribute('tabindex', '-1'); hh?.focus({ preventScroll: true }); }
    }

    function readModal() {

      else if (/^WY-[A-Z0-9]{6}$/.test(v)) { if (v === refCode) err = L('Vlastní kód nelze použít.', 'You cannot use your own code.'); else if (used) err = L('Kód kamaráda platí na první jízdu.', "A friend's code applies to the first ride."); else disc = .1; }
      else err = L('Kód neznáme. Zkuste WAYRO10.', 'Unknown code. Try WAYRO10.');
      if (!err) { S.promo = v; S.discount = disc; }
      const m = $('#promo-msg');

    function validateDetails() {
      const car = FLEET[S.car];
      if (S.flight && !/^[A-Z0-9]{2,3}\s?\d{1,4}$/.test(S.flight)) return L('Zkontrolujte číslo letu, například LH1400.', 'Check the flight number, e.g. LH1400.');
      if (S.mode === 'from' && !S.flight) return L('U jízdy z letiště prosím uveďte číslo letu, ať můžeme sledovat přílet.', 'For an airport pickup please add the flight number so we can track the arrival.');
      if (S.seats > car.seats) return L(`${car.label} nabízí ${car.seats} autosedaček. Zvolte jiný vůz.`, `${car.label} offers ${car.seats} child seats. Please pick another vehicle.`);

    function buildOrder(demo = true) {
      const q = fare();
      return {
        id: `WY-${uid().slice(0, 6).toUpperCase()}`, at: new Date().toISOString(),
        from: S.from, to: S.mode === 'hourly' ? L(`Dispozice ${S.hours} h`, `${S.hours} h hire`) : S.to,

    async function sendBooking() {
      if (busy) return;
      readModal();
      const digits = S.phone.replace(/\D/g, '');
      if (S.name.length < 2 || digits.length < 9 || digits.length > 15) { coErr(L('Vyplňte jméno a platné telefonní číslo.', 'Enter your name and a valid phone number.')); return; }
      if (!/^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(S.email)) { coErr(L('Zkontrolujte e-mail, pošleme na něj potvrzení.', 'Check the e-mail, the confirmation goes there.')); return; }
      if (!S.consent) { coErr(L('Bez souhlasu s podmínkami rezervaci nelze odeslat.', 'The booking cannot be sent without accepting the terms.')); return; }
      const err = validateDetails();
      if (err) { coErr(err); return; }
      busy = true;
      const btn = $('#co-send');
      btn.disabled = true; btn.textContent = L('Odesílám…', 'Sending…');
      try {
        if (CONFIG.bookingEndpoint) {
          const url = new URL(CONFIG.bookingEndpoint, location.href);
          // Разрешаем HTTP для localhost при локальной разработке
          if (url.protocol !== 'https:' && url.hostname !== 'localhost' && url.hostname !== '127.0.0.1') {
            throw new Error(L('Rezervace vyžaduje zabezpečený server (HTTPS).', 'Bookings require a secure server (HTTPS).'));
          }
          const returnTarget = new URL(location.href);
          returnTarget.hash = '/jizdy';

          const res = await fetch(url, { 
            method: 'POST', 
            credentials: 'same-origin', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ booking: S, returnUrl: returnTarget.href }), 
            signal: AbortSignal.timeout(20000) 
          });

          if (!res.ok) throw new Error(L('Server rezervaci nepotvrdil.', 'The server did not confirm the booking.'));
          const data = await res.json();

          const receivedId = data.orderId || data.id;
          if (!receivedId) throw new Error(L('Server nevrátil číslo rezervace.', 'The server returned no booking number.'));

          const real = buildOrder(false); 
          real.id = receivedId;
          real.payState = S.pay === 'cash' ? 'cash_on_arrival' : 'pending';
          orders.unshift(real); 
          save(); 
          modal.close();

          // Если сервер предоставил ссылку на платёжный шлюз (Stripe / Bank Gateway)
          if (data.confirmationUrl && S.pay === 'online') {
            window.location.href = data.confirmationUrl;
            return;
          }

          location.hash = `/jizda/${encodeURIComponent(real.id)}`;
          return;
        }
        const o = buildOrder(true);
        orders.unshift(o); save();
        S.name = ''; S.phone = ''; S.email = ''; S.consent = false; S.promo = ''; S.discount = 0;
        S.flight = ''; S.notes = ''; S.seats = 0; S.pram = false;
        modal.close();
        location.hash = `/jizda/${encodeURIComponent(o.id)}`;
        toast(L('Rezervace uložena lokálně. Spusť backend, aby ji dispečink uviděl a začalo sledování polohy.', 'Booking saved locally. Start the backend so dispatch sees it and live tracking begins.'));
      } catch (e) {
        coErr(e.name === 'TimeoutError' ? L('Server neodpověděl včas. Zkuste to prosím znovu.', 'The server did not respond in time. Please try again.') : e.message);
      } finally {
        busy = false;
        if (btn.isConnected) { btn.disabled = false; btn.innerHTML = `${L('Odeslat rezervaci', 'Send booking')} ${icon('arrow')}`; }
      }
    }

      if (path === '/') { renderHome(); anim(app); } else location.hash = '/';

    async function toggleSandboxDrive(id, btn) {
      if (btn) btn.disabled = true;
      const action = simId === id ? 'stop' : 'start';
      try {
        const r = await fetch(CONFIG.sandboxDriveEndpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId: id, action }), signal: AbortSignal.timeout(6000)
        });
        if (!r.ok) throw new Error();
        const d = await r.json();
        simId = d.assigned ? id : null;
        const o = orders.find(x => x.id === id);
        if (o) { o.liveOnServer = true; o.stage = Math.max(o.stage, d.assigned ? 3 : o.stage); save(); renderOrder(id); anim(app); }

      } catch {

    function confirmBox(title, desc, action, id = '') {
      kind = 'confirm';
      mbody.innerHTML = dHead(L('Potvrzení', 'Confirm'), title, desc) + `<div class="d-actions"><button class="btn btn-ghost" type="button" data-a="close">${L('Zpět', 'Back')}</button><button class="btn btn-solid" type="button" data-a="${action}" data-v="${esc(id)}">${L('Potvrdit', 'Confirm')}</button></div></div>`;
      open(true);
    }
    function privacy() {
      kind = 'privacy';
      mbody.innerHTML = dHead(L('Data a ukázka', 'Data and demo'), L('Na rovinu.', 'Straight talk.')) + `<div class="d-desc">
        <p>${L('Rezervace a hodnocení se ukládají do localStorage tohoto prohlížeče, takže je vidíte i po obnovění stránky. Není to zákaznický účet – ten vede backend.', 'Bookings and reviews are stored in this browser localStorage, so they survive a reload. It is not a customer account – that lives in the backend.')}</p>
        <p style="margin-top:14px">${L('Pozici řidiče nikdo nerisuje. Buď ji pošve řidičská aplikace do backendu, nebo se na mapě zobrazí jen plánovaná trasa.', 'The driver position is never invented. Either the driver app pushes it to the backend, or the map shows only the planned route.')}</p>
        <p style="margin-top:14px">${L('Neukládáme celé telefonní číslo, e-mail ani platební údaje. Číslo karty nikde nezadáváte a žádné peníze neodcházejí.', 'We do not store your full phone number, e-mail or payment data. No card number is entered and no money moves.')}</p>
        <p style="margin-top:14px">${L('Bez spuštěného backendu se objednávka nikam neposílá. S backendem míří na /api/checkout a platba teče přes platební bránu.', 'Without the backend nothing is sent. With it, the booking goes to /api/checkout and payment runs through the gateway.')}</p>
        <p style="margin-top:14px">${L('Sledování polohy a letů, potvrzovací e-maily a online platba by vyžadovaly serverovou část.', 'Live tracking, flight data, confirmation e-mails and online payments would require a backend.')}</p></div>
        <a class="btn btn-ghost wide" href="${SITE.home}" target="_blank" rel="noopener">${L('Otevřít provozní web', 'Open operator site')} ↗</a>
        <button class="btn btn-solid wide" type="button" data-a="close">${L('Rozumím', 'Got it')}</button></div>`;
      open(true);
    }
    async function copy(text) {
      try { await navigator.clipboard.writeText(text); toast(L('Zkopírováno.', 'Copied.')); }
      catch {
        kind = 'copy';
        mbody.innerHTML = dHead(L('Pozvánka', 'Invitation'), L('Zkopírujte ručně', 'Copy manually')) + `<textarea class="input" readonly rows="3" style="margin-top:16px">${esc(text)}</textarea></div>`;
        open(true);
      }
    }
    function download(name, body, type = 'text/plain;charset=utf-8') {
      const url = URL.createObjectURL(new Blob(['\uFEFF', body], { type }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function voucher(id) {
      const o = orders.find(x => x.id === id); if (!o) return;
      const m = MEETS[o.ext.meet], dl = cancelDeadline(o);
      download(`wayro-${o.id}.txt`, [
        `WAYRO — ${L('VOUCHER / POTVRZENÍ TRANSFERU', 'VOUCHER / TRANSFER CONFIRMATION')}`, '',
        `${L('Rezervace', 'Booking')}: ${o.id}`,
        `${L('Stav', 'Status')}: ${o.cancelled ? L('Zrušeno', 'Cancelled') : t('stages')[o.stage]}`,
        `${L('Trasa', 'Route')}: ${o.from} -> ${o.to}`,
        `${L('Vyzvednutí', 'Pickup')}: ${dtLbl(o.date, o.time)} (${TZ})`,
        `${L('Vůz', 'Vehicle')}: ${FLEET[o.car].label} · ${t('pax')(o.pax)}`,
        o.ext.flight ? `${L('Let', 'Flight')}: ${o.ext.flight}` : '',
        o.ext.fromAirport && m ? `${L('Místo setkání', 'Meeting point')}: ${m.t} — ${m.s}` : '',
        o.ext.seats ? `${L('Autosedačky', 'Child seats')}: ${o.ext.seats}× ${SEATS[o.ext.seatType]?.[lang] || ''}` : '',
        `${L('Zavazadla', 'Luggage')}: ${o.ext.bagsBig}× ${L('velké', 'large')}, ${o.ext.bagsSmall}× ${L('příruční', 'cabin')}`,
        `${L('Cena', 'Price')}: ${money(o.total)}${o.est ? ` (${L('orientační', 'estimate')})` : ''}`,
        `${L('Platba', 'Payment')}: ${t('pay')[o.pay] || o.pay}`,
        `${L('Bezplatné storno do', 'Free cancellation until')}: ${dl.when.toLocaleString('cs-CZ', { timeZone: TZ })} (${dl.hrs} h)`, '',
        `${L('Označení', 'Mark')}: ${o.demo ? L('lokální záznam – backend rezervaci nedostal', 'local record – backend did not receive it') : L('odesláno na server', 'sent to the server')}`,
        L('Voucher slouží k domluvě s řidičem. Konečné potvrzení posílá dispečink e-mailem.', 'The voucher is for arranging pickup with the driver. Final confirmation is sent by dispatch via e-mail.'),
        L('Skutečnou rezervaci vytvoříte na', 'Make a real booking at') + ' ' + SITE.home
      ].filter(Boolean).join('\n'));
      toast(L('Voucher stažen. Jde o ukázkový doklad.', 'Voucher downloaded. It is a demo document.'));
    }
    function openReview(id) {
      const o = orders.find(x => x.id === id);
      if (!o || o.stage !== 6 || reviews.some(r => r.orderId === id)) return;
      revId = id; rating = 5; kind = 'review';
      mbody.innerHTML = dHead(L('Po jízdě', 'After the ride'), L('Jak se vám jelo?', 'How was the ride?'), L('Hodnocení se uloží jen ve vašem prohlížeči.', 'The review is stored in your browser only.'))
        + `<form id="rev-form"><div class="rate" role="group" aria-label="1–5">${[1, 2, 3, 4, 5].map(v => `<button class="on" type="button" data-a="rate" data-v="${v}" aria-pressed="${v === 5}" aria-label="${v}">${icon('star')}</button>`).join('')}</div>
        <label class="form-field"><span>${L('Vaše zkušenost', 'Your experience')}</span><textarea class="input" name="text" rows="4" minlength="10" maxlength="500" required placeholder="${L('Co se povedlo? Co zlepšit?', 'What went well? What could be better?')}"></textarea></label>
        <button class="btn btn-solid wide" type="submit">${L('Uložit hodnocení', 'Save review')} ${icon('arrow')}</button></form></div>`;
      open(true);
    }
    function chat() {
      kind = 'chat';
      mbody.innerHTML = dHead(L('Průvodce', 'Assistant'), L('S čím pomoci?', 'How can I help?'), L('Lokální nápověda, ne živý dispečink.', 'Local helper, not live dispatch.'))
        + `<div class="chat-log" id="log" role="log" aria-live="polite"><p class="bubble">${L('Zeptejte se na cenu, zavazadla, autosedačku, let, storno nebo platbu.', 'Ask about price, luggage, child seats, flights, cancellation or payment.')}</p></div>
        <form class="chat-form" id="chat-form"><input class="input" name="q" maxlength="200" required placeholder="${L('Napište dotaz…', 'Type your question…')}" aria-label="${L('Dotaz', 'Question')}"><button class="btn btn-solid" type="submit" aria-label="→">${icon('arrow')}</button></form></div>`;
    }
    function menu(open, back = false) {
      document.body.classList.toggle('menu-open', open);
      $('#burger').setAttribute('aria-expanded', String(open));
      if (open) requestAnimationFrame(() => $('#nav .nav-link')?.focus());
      if (!open && back) $('#burger').focus();
    }

    /* ---------- events ---------- */
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-a]');
      if (!el || el.disabled) return;
      const { a, v } = el.dataset;
      switch (a) {
        case 'lang': lang = v; save(); shellChrome(); statsBar(); route(); break;
        case 'mode': readHome(); setMode(v); renderHome(); anim(app); break;
        case 'swap': readHome(); [S.from, S.to] = [S.to, S.from]; if (place(S.from)?.g === 'prg') S.mode = 'from'; else if (place(S.to)?.g === 'prg') S.mode = 'to'; else S.mode = 'long'; renderHome(); anim(app); break;
        case 'quick': {
          readHome();
          const presets = { t1: ['from', AIRPORT, 'Praha – centrum'], t2: ['to', 'Praha – centrum', AIRPORT], t3: ['long', AIRPORT, 'Karlovy Vary'], t4: ['long', 'Praha – centrum', 'Vídeň / Vienna'] };
          const [m, f, to] = presets[v]; S.mode = m; S.from = f; S.to = to;
          renderHome(); anim(app); break;
        }
        case 'promo-open': startBooking(true); break;
        case 'pick-mode': setMode(v); if (path === '/') { renderHome(); anim(app); } else location.hash = '/'; break;
        case 'go-business': location.hash = '/firmy'; break;
        case 'pick-meet': S.meet = v; setMode('from'); location.hash = '/'; toast(`${MEETS[v].t} · ${MEETS[v].s}`); break;
        case 'from-airport': S.flight = $('#ap-flight').value.trim().toUpperCase(); S.meet = $('#ap-meet').value; setMode('from'); location.hash = '/'; break;
        case 'fleet-filter': fleetFilter = v; renderFleet(); anim(app); break;
        case 'gallery': gallery(v); break;
        case 'g-next': case 'g-prev': gIdx = gIdx ? 0 : 1; renderGallery(); break;
        case 'pick-car': if (FLEET[v]) { S.car = v; if (modal.open) modal.close(); location.hash = '/'; toast(`${FLEET[v].label} · ${money(FLEET[v].base)} ${L('letiště – Praha', 'airport – Prague')}`); } break;
        case 'trip-filter': tripFilter = v; renderTrips(); anim(app); break;
        case 'again': again(v); break;
        case 'live-toggle': toggleSandboxDrive(v, el); break;
        case 'live-refresh': { const o = orders.find(x => x.id === v); if (o) { stopLive(); startLive(o); } break; }
        case 'next': stopSim(); advance(v); break;
        case 'delay': {
          const o = orders.find(x => x.id === v);
          if (!o || !o.demo || o.delayed || o.cancelled || o.stage >= 4) return;
          const d = stamp(o.date, o.time); d.setUTCMinutes(d.getUTCMinutes() + 30);
          o.date = dstr(d); o.time = d.toLocaleTimeString('cs-CZ', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); o.delayed = true;
          save(); renderOrder(v); anim(app);
          toast(L('Ukázka: let má zpoždění, čekáme zdarma a čas podání se posunul.', 'Demo: the flight is delayed, we wait for free and the pickup shifted.'));
          break;
        }
        case 'cancel': stopSim(); confirmBox(L('Zrušit rezervaci?', 'Cancel the booking?'), L('Jde o ukázku, nic se neúčtovalo. U skutečné rezervace je storno zdarma 2 hodiny předem, u vozů Mercedes a dálkových jízd 12 hodin.', 'This is a demo, nothing was charged. A real booking is free to cancel 2 hours ahead, or 12 hours for Mercedes vehicles and long-distance rides.'), 'cancel-yes', v); break;
        case 'cancel-yes': { const o = orders.find(x => x.id === v); if (o && o.demo && o.stage < 6) { o.cancelled = true; save(); } modal.close(); renderOrder(v); anim(app); break; }
        case 'wipe': confirmBox(L('Smazat historii?', 'Delete history?'), L('Odstraní se všechny ukázkové jízdy a hodnocení z tohoto prohlížeče.', 'All demo rides and reviews will be removed from this browser.'), 'wipe-yes'); break;
        case 'wipe-yes': orders = []; reviews = []; save(); modal.close(); renderTrips(); anim(app); break;
        case 'export': {
          const cell = x => `"${String(x).replace(/^\s*[=+@-]/, "'$&").replaceAll('"', '""')}"`;
          const rows = [[L('Číslo', 'ID'), L('Datum', 'Date'), L('Čas', 'Time'), L('Odkud', 'From'), L('Kam', 'To'), L('Vůz', 'Vehicle'), 'CZK', L('Stav', 'Status')],
            ...orders.map(o => [o.id, o.date, o.time, o.from, o.to, FLEET[o.car].label, o.total, o.cancelled ? L('Zrušeno', 'Cancelled') : t('stages')[o.stage]])];
          download('wayro-rides.csv', rows.map(r => r.map(cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
          break;
        }
        case 'voucher': voucher(v); break;
        case 'review': openReview(v); break;
        case 'rate': rating = Number(v); $$('.rate button').forEach(b => { b.classList.toggle('on', Number(b.dataset.v) <= rating); b.setAttribute('aria-pressed', String(Number(b.dataset.v) === rating)); }); break;
        case 'copy-code': copy(refCode); break;
        case 'share': { const u = new URL(location.href); u.hash = `/?ref=${refCode}`; copy(L(`Jezdím s Wayro na letiště – fixní cena a živá poloha auta. S kódem ${refCode} máš 10 % na první jízdě: ${u.href}`, `I ride with Wayro – fixed price and live car tracking. Use ${refCode} for 10 % off your first ride: ${u.href}`)); break; }
        case 'chat': chat(); open(true); break;
        case 'privacy': privacy(); break;
        case 'promo-apply': applyPromo(); break;
        case 'co-back': readModal(); step = 1; renderBook(); break;
        case 'close': if (!busy) closeModal(); break;
        case 'cnt': {
          readModal();
          const k = el.dataset.k;
          if (!['bagsBig', 'bagsSmall', 'seats'].includes(k)) return;
          const car = FLEET[S.car];
          const max = k === 'seats' ? Math.min(car.seats, S.pax) : k === 'bagsBig' ? car.bags : 4;
          S[k] = Math.max(0, Math.min(max, S[k] + Number(el.dataset.d)));
          if (k === 'seats') { renderBook(); return; }
          $(`#c-${k}`).value = S[k];
          $$(`[data-a="cnt"][data-k="${k}"]`).forEach(b => { b.disabled = Number(b.dataset.d) < 0 ? S[k] === 0 : S[k] >= max; });
          refreshSummary();
          break;
        }
      }
    });
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.closest('#book-form') && el.matches('input')) { readHome(); syncHome(); }
      if (el.matches('#biz-n')) bizTotal();
      if (el.matches('#faq-q')) { const q = el.value.trim().toLocaleLowerCase('cs'); $('#faq-list').innerHTML = faqList(FAQ.filter(f => `${f.q.cs} ${f.q.en} ${f.a.cs} ${f.a.en} ${f.k}`.toLocaleLowerCase('cs').includes(q))); }
      if (el.closest('#rev-form')) el.setCustomValidity?.('');
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.closest('#book-form')) { readHome(); fitVehicle(); if (el.id === 'rt' || el.id === 'car' || el.id === 'pax') { renderHome(); anim(app); } else syncHome(); }
      if (el.matches('[name="car"]')) { readModal(); S.car = el.value; fitVehicle(); S.seats = Math.min(S.seats, FLEET[S.car].seats); S.bagsBig = Math.min(S.bagsBig, FLEET[S.car].bags); renderBook(); }
      if (el.matches('[name="meet"]')) { S.meet = el.value; refreshSummary(); }
      if (el.matches('[name="pay"]')) { readModal(); renderBook(); }
      if (el.matches('[name="pram"], [name="seatType"]')) readModal();
      if (el.matches('#biz-car')) bizTotal();
    });
    document.addEventListener('submit', e => {
      const f = e.target;
      if (!['book-form', 'co-form', 'rev-form', 'biz-form', 'biz-send', 'chat-form'].includes(f.id)) return;
      e.preventDefault();
      if (f.id === 'book-form') { startBooking(); return; }
      if (f.id === 'co-form') {
        readModal();
        if (step === 1) { const err = validateDetails(); if (err) { coErr(err); return; } step = 2; renderBook(); $('[name="name"]')?.focus(); }
        else sendBooking();
        return;
      }
      if (f.id === 'rev-form') {
        const txt = String(new FormData(f).get('text') || '').trim();
        const field = $('[name="text"]', f);
        if (txt.length < 10) { field.setCustomValidity(L('Napište prosím alespoň 10 znaků.', 'Please write at least 10 characters.')); field.reportValidity(); return; }
        const o = orders.find(x => x.id === revId);
        if (!o || o.stage !== 6 || reviews.some(r => r.orderId === revId)) return;
        reviews.unshift({ orderId: revId, rating, text: txt, name: o.name || '', at: new Date().toISOString() });
        save(); modal.close(); location.hash = '/hodnoceni';
        toast(L('Děkujeme! Hodnocení je uložené ve vašem prohlížeči.', 'Thank you! The review is stored in your browser.'));
        return;
      }
      if (f.id === 'biz-form') {
        const b = bizQuote(); kind = 'biz';
        mbody.innerHTML = dHead(L('Pro firmy', 'For business'), L('Podklad pro poptávku', 'Request document'), L('Soubor si stáhnete, automaticky se nikam neodesílá.', 'You download the file; nothing is sent automatically.'))
          + `<form id="biz-send" data-n="${b.n}" data-c="${b.c}" data-t="${b.total}"><label class="form-field" style="margin-top:18px"><span>${L('Firma', 'Company')}</span><input class="input" name="co" maxlength="100" required></label>
          <label class="form-field"><span>${L('Kontaktní e-mail', 'Contact e-mail')}</span><input class="input" name="mail" type="email" maxlength="120" required></label>
          <div class="total-row"><span>${b.n}× ${FLEET[b.c].label}</span><strong>${money(b.total)}</strong></div>
          <button class="btn btn-solid wide" type="submit">${icon('download')}${L('Stáhnout podklad', 'Download')}</button></form></div>`;
        open(true); return;
      }
      if (f.id === 'biz-send') {
        const d = new FormData(f);
        download('wayro-firemni-poptavka.txt', `WAYRO — ${L('PŘEDBĚŽNÁ POPTÁVKA', 'PRELIMINARY REQUEST')}\n\n${L('Firma', 'Company')}: ${d.get('co')}\nE-mail: ${d.get('mail')}\n${L('Jízd měsíčně', 'Rides per month')}: ${f.dataset.n}\n${L('Vůz', 'Vehicle')}: ${FLEET[f.dataset.c].label}\n${L('Vzorová trasa', 'Sample route')}: ${AIRPORT} – Praha\n${L('Orientační rozpočet', 'Estimated budget')}: ${money(Number(f.dataset.t))}\n\n${L('Nezávazný odhad, nejde o nabídku ani smlouvu. Poptávka nebyla odeslána.', 'Non-binding estimate, not an offer or contract. The request was not sent.')}\n`);
        modal.close(); toast(L('Podklad stažen. Odeslání dispečinku není v ukázce připojené.', 'File downloaded. Sending to dispatch is not connected in this demo.'));
        return;
      }
      if (f.id === 'chat-form') {
        const input = $('[name="q"]', f), msg = input.value.trim();
        if (!msg) return;
        const log = $('#log');
        const me = document.createElement('p'); me.className = 'bubble me'; me.textContent = msg; log.append(me); input.value = '';
        const words = msg.toLocaleLowerCase('cs').split(/\s+/).filter(w => w.length > 3);
        const best = FAQ.map(x => ({ x, s: words.reduce((n, w) => n + (`${x.q.cs} ${x.q.en} ${x.k}`.toLocaleLowerCase('cs').includes(w.slice(0, 5)) ? 1 : 0), 0) })).sort((a, b) => b.s - a.s)[0];
        const bot = document.createElement('p'); bot.className = 'bubble';
        bot.textContent = best?.s ? (best.x.a[lang] || best.x.a.cs) : L('Zkuste se zeptat na cenu, zavazadla, autosedačku, let, storno nebo platbu. Jsem lokální nápověda, zprávy se neodesílají dispečinku.', 'Try asking about price, luggage, child seats, flights, cancellation or payment. I am a local helper; messages are not sent to dispatch.');
        log.append(bot); log.scrollTop = log.scrollHeight; input.focus();
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.body.classList.contains('menu-open')) menu(false, true);
      if (e.key === 'Enter' && e.target.id === 'promo') { e.preventDefault(); applyPromo(); }
      if (e.key === 'Tab' && document.body.classList.contains('menu-open')) {
        const items = $$('.logo, #nav a, .header-cta, #burger').filter(x => x.getClientRects().length);
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    document.addEventListener('error', e => {
      const img = e.target;
      if (img instanceof HTMLImageElement && !img.dataset.failed) {
        img.dataset.failed = '1';
        img.style.opacity = '0';
      }
    }, true);
    $('#burger').addEventListener('click', () => menu(!document.body.classList.contains('menu-open')));
    $('#backdrop').addEventListener('click', () => menu(false, true));
    $('#nav').addEventListener('click', e => { if (e.target.closest('a')) menu(false); });
    const wide = matchMedia('(min-width: 901px)');
    const onWide = () => { if (wide.matches) menu(false); };
    wide.addEventListener ? wide.addEventListener('change', onWide) : wide.addListener(onWide);
    window.addEventListener('hashchange', route);
    window.addEventListener('pagehide', stopSim);
    window.addEventListener('storage', ev => {
      if (ev.key !== KEY) return;
      try {
        const d = JSON.parse(ev.newValue || '{}');
        orders = Array.isArray(d.orders) ? d.orders.filter(okOrder) : [];
        reviews = Array.isArray(d.reviews) ? d.reviews.filter(r => r && typeof r.text === 'string' && Number.isInteger(r.rating)) : [];
        count();
        if (['/jizdy', '/hodnoceni'].includes(path) || path.startsWith('/jizda/')) { route(); }
      } catch { /* ignore unrelated storage writes */ }
    });

    shellChrome();
    statsBar();
    if (store.ref !== refCode || store.lang !== lang) save();
    count();
    route();
    anim(document);
    if (!storageOk) toast(L('Úložiště prohlížeče není dostupné, rezervace se neuloží.', 'Browser storage is unavailable; bookings will not be saved.'));
  })();
  </script>
</body>
</html>
